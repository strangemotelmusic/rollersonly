name: Settle auctions (manual fallback)

# Scheduled trigger removed 2026-09-07: now on Vercel Cron (vercel.json),
# which runs reliably at */5 on the Pro plan instead of GitHub's throttled
# schedule triggers. Kept as a manual workflow_dispatch fallback.
on:
  workflow_dispatch: {}

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Call settlement endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://rollersonly.vercel.app/api/cron/settle-auctions
